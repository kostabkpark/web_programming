<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/jquery-3.7.0.min.js"></script>
    <script>
        $(()=>{
            $('img').each((i, img)=>{
                $(img).attr({
                    src : './img/spring.jpg',
                    alt : 'spring',
                    width : (i+1)*100,
                    height : 100
                });
            });
        });
    </script>
</head>
<body>
    <img src="" alt="">    
    <img src="" alt="">
    <img src="" alt="">
</body>
</html>
