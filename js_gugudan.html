<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function gugudan(n) {
            if(n != null && !isNaN(n)) {
                n = parseInt(n)
                if( n < 1 || n > 9) {
                console.log("잘못된 입력입니다.");
                } else {
                    for(let i=1; i<=9; i++) {
                        document.write(n + " * " + i + " = " + i * n + "<br>");
                    }
                }
            }
            console.log("잘못된 입력입니다.");
        }
    </script>
</head>
<body>
    <h3>구구단 출력 함수</h3>
    <hr>
   <script>
    // 사용자로부터 구구단 몇단 을 출력할지 입력을 받아서 구구단을 출력한다.
    let dan = prompt("구구단 몇단을 출력할까요");
    gugudan(dan);
   </script>
</body>
</html>
