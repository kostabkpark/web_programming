<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline-block</title>
    <style>
      div#container {
        background-color: skyblue;
        padding: 10px;
        width: 80%;
      }
      .block {
        display: inline-block;
        background-color: orange;
        margin: 10px 30px;
        padding: 5px;
        width: 50px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <h3>인라인 블록</h3>
    <div id="container">
      <div class="block">inline-block</div>
      <div class="block">inline-block</div>
      <div class="block">inline-block</div>
    </div>

    <p>나는<span style="visibility: hidden;">visibility:hidden</span>입니다.</p>
  </body>
    <p>나는<span style="display: none">display(none)</span>입니다.</p>
  </body>
</html>
