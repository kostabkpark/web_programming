<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/jquery-3.7.0.min.js"></script>
    <script>
        $(()=> {
            const handler = function (event) {
            $('<h1></h1>').text($(event.target).text())
                .click(handler)
                .appendTo($('body'))
            };
            $('h1').click(handler);
        });
    </script>
</head>
<body>
    <h1>header-1</h1>
    <h1>header-2</h1>
</body>
</html>
