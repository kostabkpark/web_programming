<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./js/jquery-3.7.0.min.js"></script>
  </head>
  <body>
    <script>
      $(() => {
        for (let i = 0; i < 256; i++) {
          $("<div></div>")
            .css({
              height: 16,
              backgroundColor: `rgb(${i},${i},${i})`
            })
            .text(`${i}`)
            .appendTo("body");
        }
      });
    </script>
  </body>
</html>
