<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let ret = prompt("이름을 입력하세요", "홍길동");
        if(ret == null) {
            document.write("이름을 입력하지 않았습니다.");
        } else {
            document.write("당신의 이름은 " + ret + "입니다.");
        }
    </script>
</body>
</html>
