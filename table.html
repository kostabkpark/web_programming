<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table-학생의 점수</title>
    <style>
        table, td , th {border:1px solid; border-collapse: collapse;}
    </style>
</head>
<body>
    <table>
        <tr>
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>90</td>
            <td>80</td>
        </tr>
        <tr>
            <td>김연아</td>
            <td>100</td>
            <td>90</td>
        </tr>
        <tr>
            <td>손흥민</td>
            <td>80</td>
            <td>70</td>
        </tr>
        <tr>
            <td>합계</td>
            <td>270</td>
            <td>240</td>
            
        </tr>
    </table>
</body>
</html>
