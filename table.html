<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table-학생의 점수</title>
    <style>
      table,
      td,
      th {
        border-bottom: 1px solid;
        border-collapse: collapse;
      }
      thead {
        background-color: darkgray;
        color: yellow;
      }
      thead th {
        width: 60px;
        height: 30px;
      }
      tfoot td {
        width: 60px;
        height: 30px;
      }

      tbody tr:nth-child(odd) {
        background-color: lightgray;
      }

      tbody tr:hover {
        background-color: linen;
      }
      tbody td {
        text-align: right;
      }
      tbody td.name {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>이름</th>
          <th>국어</th>
          <th>영어</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <th>합계</th>
          <th>270</th>
          <th>240</th>
        </tr>
      </tfoot>
      <tbody>
        <tr>
          <td class="name">홍길동</td>
          <td>90</td>
          <td>80</td>
        </tr>
        <tr>
          <td class="name">김연아</td>
          <td>100</td>
          <td>90</td>
        </tr>
        <tr>
          <td class="name">손흥민</td>
          <td>80</td>
          <td>70</td>
        </tr>
        <tr>
            <td class="name">유경록</td>
            <td>70</td>
            <td>55</td>
          </tr>
      </tbody>
    </table>
  </body>
</html>
