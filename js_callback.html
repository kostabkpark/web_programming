<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 함수의 정의
        function func(a, b, callback) {
            console.log(a+b);
            callback();
        }
    </script>
</head>
<body>
    <script>
        // 함수의 호출
        func(1,2,
            //익명함수
            () => console.log("익명함수입니다.")
        )
    </script>
</body>
</html>
