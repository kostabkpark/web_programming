<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 폼</title>
  </head>
  <body>
    <header>
      <h3>로그인 폼</h3>
    </header>
    <hr />
    <form action="server.jsp" method="get">
      <fieldset>
        <legend>로그인</legend>
        <label for="id">아이디</label
        ><input type="text" id="id" name="userid" /><br />
        <label for="pwd">암호</label
        ><input type="password" id="pwd" name="pwd" /><br />
        <input type="submit" value="로그인" />
      </fieldset>
    </form>

    <form action="#">
        <fieldset>
            <legend>자기소개</legend>
            <label for="email">이메일</label
                ><input
                  type="email"
                  id="email"
                  placeholder="a@naver.com 형식으로 입력하세요."
                /><br />
                <label for="number">숫자</label><input type="number" id="number" /><br />
                <label for="color">색깔</label><input type="color" id="color" /><br />
                <label for="textarea">자기소개</label
                ><textarea name="text" id="text" cols="10" rows="10" id="textarea">
          ddkdk</textarea
                ><br />
                <input type="submit" value="확인" />
        </fieldset>
    </form>
  </body>
</html>
