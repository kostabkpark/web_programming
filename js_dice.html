<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>주사위 던지기</h3>
    <hr>
    <script>
        for(let i=0; i<10; i++ ) {

            document.write("</p>");
        }
    </script>
