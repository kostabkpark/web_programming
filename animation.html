<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        @keyframes textColorChange {
            0% {color:red;}
            50% {color:green;}
            100% {color:blue;}
        }
        span#animation {
            animation: textColorChange 5s infinite;
        }
        span#transition {
            transition: font-size 5s;
        }
        span#transition:hover {
            font-size:500%;
        }
    </style>
  </head>
  <body>
    <h3>애니메이션</h3>
    <hr />
    <p>
      <span id="animation">span</span>텍스트의 색상을 3초동안 red, green, blue 로 변경하는 것을
      무한반복합니다.
    </p>

    <p><span id="transition">꽝</span></p>
  </body>
</html>
