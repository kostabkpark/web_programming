    <hr>
    <script>
        function Student(name) {
            this.univ = "kosta";
            this.name = name;
        }

        let std1 = new Student("홍길동");
        let std2 = new Student("김연아");
        document.write("<p>" + std1.name + " , " + std2.name +  "</p>")
        document.write(`<p>${std1.name} , ${std2.name} </p>`);

        // ES6 방식
        class Car {
            constructor(name) {
                this.name = name;
            }
        }

        let car1 = new Car("Tesla");

        document.write(car1.name + "<br>");
    </script>
