<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function init() {
        let p = document.getElementById("p");
        p.addEventListener("mouseover", () =>{
          p.style.color = "red";
        });
        p.addEventListener("mouseout", () => {
          p.style.color="black";
        });
      //   p.onmouseover =  () => {
      //   p.style.color = "red";
      // };
      //   p.onmouseout = () => {
      //   p.style.color = "black";
      // };
      }
    </script>
  </head>
  <body onload="init()">
    <p id="p">마우스를 올리면 색깔이 변합니다.</p>
    <script></script>
  </body>
</html>
