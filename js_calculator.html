<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>계산기 만들기</h3>
    <hr />
    <form action="#" name="form" onsubmit="onSubmit(event)">
      <label for="expr">식</label>
      <input type="text" id="expr" name="expr" /><br />
      <label for="result">계산결과</label>
      <input type="text" id="result" name="result" value="0" readonly/>
      <input type="submit" value="계산" />
      <input type="reset" value="reset">
    </form>
    <script>
      function onSubmit(e) {
        e.preventDefault();
        let expr = document.querySelector("#expr");
        let result = document.querySelector("#result");
        // console.log(expr.value);
        result.value = eval(expr.value);
      }
    </script>
  </body>
</html>
