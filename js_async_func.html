<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <script>
        // 비동기 함수 , callback 함수를 매개변수로 사용한다.
        setTimeout( () => {
            console.log("1초후에 실행됩니다.")
        },  1000);

        setTimeout( () => {
            console.log("3초후에 실행됩니다.")
        },  3000);

        setTimeout( () => {
            console.log("5초후에 실행됩니다.")
        },  5000);
        
    </script>
</body>
</html>
